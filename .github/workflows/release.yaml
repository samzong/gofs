name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write # Required for Cosign signing
      security-events: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      release-created: ${{ steps.completed.outputs.release-created }}
    steps:
      - name: Verify SemVer release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=${GITHUB_REF#refs/tags/}
          if [[ ! "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.(0|[1-9][0-9]*))?$ ]]; then
            echo "::error::Invalid SemVer release tag: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing version: $VERSION"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true
          cache-dependency-path: |
            go.sum
            go.mod

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Update Docker Hub README
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/gofs
          readme-filepath: ./README.docker.md
          short-description: "A lightweight, fast HTTP file server written in Go"

      - name: Run GoReleaser
        id: release
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          CGO_ENABLED: 0
        continue-on-error: false

      - name: Run Trivy vulnerability scanner on source code
        if: steps.release.outcome == 'success'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
        continue-on-error: true

      - name: Upload Trivy scan results to GitHub Security tab
        if: steps.release.outcome == 'success' && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-results.sarif"
          category: "trivy-source"

      - name: Scan Docker images with Trivy
        if: steps.release.outcome == 'success'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "ghcr.io/${{ github.repository }}:${{ github.ref_name }}"
          format: "sarif"
          output: "trivy-image-results.sarif"
        continue-on-error: true

      - name: Upload Docker image scan results
        if: steps.release.outcome == 'success' && hashFiles('trivy-image-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-image-results.sarif"
          category: "trivy-image"

      - name: Generate SBOM for source code
        uses: anchore/sbom-action@v0.17.2
        with:
          path: .
          format: spdx-json
          output-file: sbom-source.spdx.json

      - name: Generate SBOM for Docker image
        uses: anchore/sbom-action@v0.17.2
        with:
          image: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          format: spdx-json
          output-file: sbom-image.spdx.json

      - name: Install Cosign for container signing
        uses: sigstore/cosign-installer@v3.7.0

      - name: Sign container image with Cosign
        run: |
          cosign sign --yes ghcr.io/${{ github.repository }}:${{ github.ref_name }}

      - name: Sign latest container image with Cosign
        if: ${{ !contains(github.ref_name, '-') }}
        run: cosign sign --yes ghcr.io/${{ github.repository }}:latest

      - name: Attest SBOM to container image
        run: |
          cosign attest --yes --predicate sbom-source.spdx.json --type spdxjson ghcr.io/${{ github.repository }}:${{ github.ref_name }}

      - name: Attest SBOM to latest container image
        if: ${{ !contains(github.ref_name, '-') }}
        run: cosign attest --yes --predicate sbom-image.spdx.json --type spdxjson ghcr.io/${{ github.repository }}:latest

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom-files
          path: |
            sbom-source.spdx.json
            sbom-image.spdx.json

      - name: Mark release as completed
        id: completed
        run: |
          echo "✅ Release ${{ steps.version.outputs.version }} completed successfully"
          echo "release-created=true" >> "$GITHUB_OUTPUT"
